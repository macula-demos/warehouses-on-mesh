name: warehouses-lab

# Phase 1 baseline: part 1's single-site lab, without the attacker container
# and without the legacy edge. It is the base the two-site split grows from.
services:
  station-cookie:
    image: alpine:3.20
    user: "0:0"
    network_mode: none
    environment:
      STATION_COOKIE: ${STATION_COOKIE:-d4f8a2c9e7b1f6a3c5d9e2b8f4a7c1d6e3b9f2a5c8d1e7b4a6f9c3d2e8b5a1f7}
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /home/app
        umask 077
        printf '%s' "$$STATION_COOKIE" > /home/app/.erlang.cookie
        chown 10001:10001 /home/app/.erlang.cookie
        chmod 600 /home/app/.erlang.cookie
    volumes:
      - station_home:/home/app
    restart: "no"

  station:
    image: ghcr.io/macula-io/macula-station:0.13.3
    depends_on:
      station-cookie:
        condition: service_completed_successfully
    environment:
      MACULA_STATION_CONFIG: /etc/macula-station/config.json
    volumes:
      - ./station/config.json:/etc/macula-station/config.json:ro
      - station_home:/home/app
      - station_data:/var/lib/macula/station
    networks:
      - mesh_net
    pids_limit: 4096
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8443/wire"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  freezer-controller:
    build:
      context: ../apps/freezer_controller
    image: warehouses-demo/freezer-controller:dev
    pull_policy: build
    environment:
      LEGACY_ADMIN_USER: admin
      LEGACY_ADMIN_PASSWORD: admin
      GATEWAY_USER: gateway
      GATEWAY_PASSWORD: ${GATEWAY_PASSWORD:-gateway-demo-password}
      SIM_SPEED: "5"
    networks:
      - ot_net
    pids_limit: 4096
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  ot-realm-fixture:
    build:
      context: ../apps/ot_realm_fixture
      dockerfile: Containerfile
    image: warehouses-demo/ot-realm-fixture:dev
    pull_policy: build
    depends_on:
      station:
        condition: service_started
    volumes:
      - ./generated:/mesh
      - realm_data:/data
    networks:
      - mesh_net
    pids_limit: 4096
    restart: unless-stopped

  ot-gateway:
    build:
      context: ../apps/ot_gateway
      dockerfile: Containerfile
    image: warehouses-demo/ot-gateway:dev
    pull_policy: build
    depends_on:
      station:
        condition: service_started
      ot-realm-fixture:
        condition: service_started
      freezer-controller:
        condition: service_healthy
      admin-ui:
        condition: service_started
    environment:
      CONTROLLER_URL: http://freezer-controller:8080
      GATEWAY_USER: gateway
      GATEWAY_PASSWORD: ${GATEWAY_PASSWORD:-gateway-demo-password}
      MACULA_STATION_SEEDS: station:4433
      MCL_SERVICE_NAME: mcl-ot-gateway
      MCL_BOX: warehouses-lab
      MESH_CONFIG_PATH: /mesh/realm.json
      MESH_OPERATOR_NODE_ID_PATH: /mesh/operator-node-id
    volumes:
      - ./generated:/mesh
      - gateway_secrets:/etc/mcl/secrets
    networks:
      - mesh_net
      - ot_net
    pids_limit: 4096
    restart: unless-stopped

  admin-ui:
    build:
      context: ../apps/admin_ui
    image: warehouses-demo/admin-ui:dev
    pull_policy: build
    environment:
      LEGACY_EDGE_URL: http://127.0.0.1:9
      PHX_SERVER: "true"
      PHX_HOST: localhost
      PORT: "4000"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-warehouses-demo-secret-key-base-not-for-production-0123456789abcdef0123456789abcdef}
      MESH_CONFIG_PATH: /mesh/realm.json
      MESH_IDENTITY_PATH: /data/operator.key
      MESH_OPERATOR_NODE_ID_PATH: /mesh/operator-node-id
      MESH_STATION_SEEDS: station:4433
    volumes:
      - ./generated:/mesh
      - operator_data:/data
    networks:
      - mesh_net
      - ui_net
    ports:
      - "4000:4000"
    pids_limit: 4096
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  mesh_net:
    internal: true
  ot_net:
    internal: true
  ui_net:

volumes:
  station_home:
  station_data:
  realm_data:
  gateway_secrets:
  operator_data:
