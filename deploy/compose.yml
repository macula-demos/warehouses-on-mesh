name: warehouses-lab

# Two sites, two gateways, two federated stations, and one dashboard at site A.
# Neither site publishes an inbound port; everything dials out. The only
# published port is the dashboard's browser listener.
services:
  station-a-cookie:
    image: alpine:3.20
    user: "0:0"
    network_mode: none
    environment:
      STATION_COOKIE: ${STATION_COOKIE:-d4f8a2c9e7b1f6a3c5d9e2b8f4a7c1d6e3b9f2a5c8d1e7b4a6f9c3d2e8b5a1f7}
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /home/app
        umask 077
        printf '%s' "$$STATION_COOKIE" > /home/app/.erlang.cookie
        chown 10001:10001 /home/app/.erlang.cookie
        chmod 600 /home/app/.erlang.cookie
    volumes:
      - station_a_home:/home/app
    restart: "no"

  station-b-cookie:
    image: alpine:3.20
    user: "0:0"
    network_mode: none
    environment:
      STATION_COOKIE: ${STATION_COOKIE:-d4f8a2c9e7b1f6a3c5d9e2b8f4a7c1d6e3b9f2a5c8d1e7b4a6f9c3d2e8b5a1f7}
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /home/app
        umask 077
        printf '%s' "$$STATION_COOKIE" > /home/app/.erlang.cookie
        chown 10001:10001 /home/app/.erlang.cookie
        chmod 600 /home/app/.erlang.cookie
    volumes:
      - station_b_home:/home/app
    restart: "no"

  station-a:
    image: ghcr.io/macula-io/macula-station:0.13.3
    depends_on:
      station-a-cookie:
        condition: service_completed_successfully
    environment:
      MACULA_STATION_CONFIG: /etc/macula-station/config.json
      MACULA_NODE_NAME: macula_station_a
    volumes:
      - ./generated/station-a.json:/etc/macula-station/config.json:ro
      - station_a_home:/home/app
      - station_a_data:/var/lib/macula/station
    networks:
      mesh_net:
        ipv4_address: 172.28.0.10
    pids_limit: 4096
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8443/wire"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  station-b:
    image: ghcr.io/macula-io/macula-station:0.13.3
    depends_on:
      station-b-cookie:
        condition: service_completed_successfully
    environment:
      MACULA_STATION_CONFIG: /etc/macula-station/config.json
      MACULA_NODE_NAME: macula_station_b
    volumes:
      - ./generated/station-b.json:/etc/macula-station/config.json:ro
      - station_b_home:/home/app
      - station_b_data:/var/lib/macula/station
    networks:
      mesh_net:
        ipv4_address: 172.28.0.11
    pids_limit: 4096
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8443/wire"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  freezer-controller-a:
    build:
      context: ../apps/freezer_controller
    image: warehouses-demo/freezer-controller:dev
    pull_policy: build
    environment:
      SITE_ID: A
      RELEASE_DISTRIBUTION: none
      LEGACY_ADMIN_USER: admin
      LEGACY_ADMIN_PASSWORD: admin
      GATEWAY_USER: gateway
      GATEWAY_PASSWORD: ${GATEWAY_PASSWORD:-gateway-demo-password}
      SIM_SPEED: "5"
    networks:
      - site_a_net
    pids_limit: 4096
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  freezer-controller-b:
    build:
      context: ../apps/freezer_controller
    image: warehouses-demo/freezer-controller:dev
    pull_policy: build
    environment:
      SITE_ID: B
      RELEASE_DISTRIBUTION: none
      LEGACY_ADMIN_USER: admin
      LEGACY_ADMIN_PASSWORD: admin
      GATEWAY_USER: gateway
      GATEWAY_PASSWORD: ${GATEWAY_PASSWORD:-gateway-demo-password}
      SIM_SPEED: "5"
    networks:
      - site_b_net
    pids_limit: 4096
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  ot-realm-fixture:
    build:
      context: ../apps/ot_realm_fixture
      dockerfile: Containerfile
    image: warehouses-demo/ot-realm-fixture:dev
    pull_policy: build
    depends_on:
      station-a:
        condition: service_started
      station-b:
        condition: service_started
    volumes:
      - ./generated:/mesh
      - realm_data:/data
    networks:
      - mesh_net
    pids_limit: 4096
    restart: unless-stopped

  ot-gateway-a:
    build:
      context: ../apps/ot_gateway
      dockerfile: Containerfile
    image: warehouses-demo/ot-gateway:dev
    pull_policy: build
    depends_on:
      station-a:
        condition: service_started
      ot-realm-fixture:
        condition: service_started
      freezer-controller-a:
        condition: service_healthy
      admin-ui:
        condition: service_started
    environment:
      CONTROLLER_URL: http://freezer-controller-a:8080
      GATEWAY_USER: gateway
      GATEWAY_PASSWORD: ${GATEWAY_PASSWORD:-gateway-demo-password}
      MACULA_STATION_SEEDS: station-a:4433
      MCL_SERVICE_NAME: mcl-ot-gateway
      MCL_BOX: warehouse-a
      MESH_CONFIG_PATH: /mesh/realm-a.json
      MESH_OPERATOR_NODE_ID_PATH: /mesh/operator-node-id
    volumes:
      - ./generated:/mesh
      - gateway_secrets_a:/etc/mcl/secrets
    networks:
      - mesh_net
      - site_a_net
    pids_limit: 4096
    restart: unless-stopped

  ot-gateway-b:
    build:
      context: ../apps/ot_gateway
      dockerfile: Containerfile
    image: warehouses-demo/ot-gateway:dev
    pull_policy: build
    depends_on:
      station-b:
        condition: service_started
      ot-realm-fixture:
        condition: service_started
      freezer-controller-b:
        condition: service_healthy
      admin-ui:
        condition: service_started
    environment:
      CONTROLLER_URL: http://freezer-controller-b:8080
      GATEWAY_USER: gateway
      GATEWAY_PASSWORD: ${GATEWAY_PASSWORD:-gateway-demo-password}
      MACULA_STATION_SEEDS: station-b:4433
      MCL_SERVICE_NAME: mcl-ot-gateway
      MCL_BOX: warehouse-b
      MESH_CONFIG_PATH: /mesh/realm-b.json
      MESH_OPERATOR_NODE_ID_PATH: /mesh/operator-node-id
    volumes:
      - ./generated:/mesh
      - gateway_secrets_b:/etc/mcl/secrets
    networks:
      - mesh_net
      - site_b_net
    pids_limit: 4096
    restart: unless-stopped

  admin-ui:
    build:
      context: ../apps/admin_ui
    image: warehouses-demo/admin-ui:dev
    pull_policy: build
    environment:
      RELEASE_DISTRIBUTION: none
      PHX_SERVER: "true"
      PHX_HOST: localhost
      PORT: "4000"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-warehouses-demo-secret-key-base-not-for-production-0123456789abcdef0123456789abcdef}
      MESH_CONFIG_PATH: /mesh/realm.json
      MESH_IDENTITY_PATH: /data/operator.key
      MESH_OPERATOR_NODE_ID_PATH: /mesh/operator-node-id
      MESH_STATION_SEEDS: station-a:4433
    volumes:
      - ./generated:/mesh
      - operator_data:/data
    networks:
      - mesh_net
      - ui_net
    ports:
      - "4000:4000"
    pids_limit: 4096
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  mesh_net:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  site_a_net:
    internal: true
  site_b_net:
    internal: true
  ui_net:

volumes:
  station_a_home:
  station_a_data:
  station_b_home:
  station_b_data:
  realm_data:
  gateway_secrets_a:
  gateway_secrets_b:
  operator_data:
